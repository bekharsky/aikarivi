<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f5" />
    <meta name="description" content="A quiet, local-first writing space. Focus on one task, capture each moment, and keep your notes on this device." />
    <title>Aikarivi — quiet writing space</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./tokens.css?v=5" />
    <link rel="stylesheet" href="./components.css?v=3" />
    <link rel="stylesheet" href="./styles.css?v=27" />
    <script defer src="./editor-model.js?v=3"></script>
    <script defer src="./components.js?v=2"></script>
    <script defer src="./app.js?v=28"></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="../" aria-label="Aikarivi home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Aikarivi</span>
      </a>
      <div class="header-actions">
        <button class="ui-button ui-button--compact" id="import-button" type="button">Open</button>
        <button class="ui-button ui-button--compact ui-button--strong" id="export-button" type="button">Export .md</button>
      </div>
    </header>

    <main class="workspace">
      <h1 class="visually-hidden">Aikarivi — focused writing</h1>

      <section class="note-heading" aria-label="Document controls">
        <div class="document-title">
          <label class="visually-hidden" for="task-title">Document title</label>
          <div class="title-field">
            <span class="title-sizing" id="title-sizing" aria-hidden="true">Untitled note</span>
            <input id="task-title" class="note-title" type="text" size="1" maxlength="120" placeholder="Untitled note" autocomplete="off" />
          </div>
          <button class="ui-button ui-icon-button" id="edit-title-button" type="button" aria-label="Edit document title" title="Edit title">
            <svg class="ui-icon" viewBox="0 0 20 20" aria-hidden="true">
              <path d="m13.8 3.2 3 3M3.5 16.5l3.6-.8L16 6.8a2.1 2.1 0 0 0-3-3l-8.9 8.9z" />
            </svg>
          </button>
        </div>
        <div class="ui-control-group document-actions">
          <div class="ui-dropdown" id="document-menu">
            <button class="ui-button ui-dropdown-trigger note-picker" id="note-picker" type="button" aria-label="Choose a document" aria-expanded="false" aria-controls="document-popover" title="Choose a saved document">
              <svg class="ui-icon ui-icon--small" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 3.5h9v12h-9zM3.5 6.5v10h9" /></svg>
              <span class="document-picker-label">Documents</span>
              <span class="ui-chevron" aria-hidden="true"></span>
            </button>
            <div class="ui-popover ui-popover--end document-popover" id="document-popover" role="menu" aria-label="Saved documents" hidden>
              <p class="ui-popover-heading" aria-hidden="true">Documents</p>
              <div class="ui-menu-list" id="document-options" role="none"></div>
            </div>
          </div>
          <button class="ui-button new-note-button" id="new-note-button" type="button" aria-label="New document" title="Start a new document">
            <svg class="ui-icon ui-icon--small" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
            <span class="new-note-label">New document</span>
          </button>
        </div>
      </section>

      <section class="ui-surface session-panel" aria-label="Time and writing settings">
        <div class="controls-main">
          <div class="ui-segmented" role="group" aria-label="Timestamp mode">
            <button class="ui-button ui-button--compact mode-button is-active" type="button" data-mode="countdown" aria-pressed="true">
              Countdown
            </button>
            <button class="ui-button ui-button--compact mode-button" type="button" data-mode="clock" aria-pressed="false">
              Time of day
            </button>
          </div>

          <div class="clock-display" id="clock-display" hidden>
            <output id="clock-readout" aria-live="off"></output>
          </div>

          <div class="timer-controls" id="timer-controls" aria-label="Timer">
            <button class="ui-button ui-icon-button transport-button" id="play-button" type="button" aria-label="Start timer" title="Start timer">
              <span class="transport-icon" id="transport-icon" aria-hidden="true">
                <svg class="play-glyph" viewBox="0 0 20 20"><path d="M6.4 4.7c0-.7.8-1.1 1.4-.7l7.1 5c.5.4.5 1.2 0 1.6l-7.1 5c-.6.4-1.4 0-1.4-.7z" /></svg>
                <svg class="pause-glyph" viewBox="0 0 20 20"><path d="M6 4.8h3v10.4H6zM11 4.8h3v10.4h-3z" /></svg>
              </span>
            </button>
            <button class="ui-button ui-icon-button reset-button" id="reset-button" type="button" aria-label="Reset timer" title="Reset timer">
              <svg class="ui-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.4 7.2A6.2 6.2 0 1 1 4 11M4.4 3.7v3.8h3.8" /></svg>
            </button>
            <div class="ui-dropdown" id="duration-menu">
              <button class="ui-button ui-dropdown-trigger timer-trigger" id="timer-trigger" type="button" aria-label="Timer duration settings" aria-expanded="false" aria-controls="duration-popover" title="Timer duration settings">
                <output class="timer-readout" id="timer-readout" aria-live="off">01:00:00</output>
              </button>
              <div class="ui-popover duration-popover" id="duration-popover" role="dialog" aria-label="Timer duration" hidden>
                <p class="ui-popover-heading">Timer duration</p>
                <div class="duration-presets" aria-label="Timer presets">
                  <button class="ui-button ui-button--subtle" type="button" data-duration="900">15 min</button>
                  <button class="ui-button ui-button--subtle" type="button" data-duration="1500">25 min</button>
                  <button class="ui-button ui-button--subtle" type="button" data-duration="2700">45 min</button>
                  <button class="ui-button ui-button--subtle" type="button" data-duration="3600">1 hour</button>
                  <button class="ui-button ui-button--subtle" type="button" data-duration="5400">1.5 hours</button>
                  <button class="ui-button ui-button--subtle" type="button" data-duration="7200">2 hours</button>
                </div>
                <form id="custom-duration-form">
                  <label for="custom-minutes">Minutes</label>
                  <input class="ui-input" id="custom-minutes" type="number" min="1" max="1440" value="60" inputmode="numeric" />
                  <button class="ui-button ui-button--subtle" type="submit">Set</button>
                </form>
              </div>
            </div>
          </div>

          <div class="ui-dropdown detail-menu" id="detail-menu">
            <button class="ui-button ui-dropdown-trigger detail-trigger" id="detail-trigger" type="button" aria-label="Timestamp detail" aria-expanded="false" aria-controls="detail-popover" title="Timestamp detail">
              <span id="detail-readout">h:m:s</span>
              <span class="ui-chevron" aria-hidden="true"></span>
            </button>
            <div class="ui-popover ui-popover--end detail-popover" id="detail-popover" role="menu" aria-label="Timestamp detail" hidden>
              <p class="ui-popover-heading" aria-hidden="true">Timestamp detail</p>
              <div class="ui-menu-list" id="timestamp-unit-list" role="group" aria-label="Timestamp units"></div>
              <div class="ui-menu-section" role="group" aria-label="Timestamp presets">
                <button class="ui-menu-item" type="button" role="menuitem" tabindex="-1" data-format="exact" data-menu-close>Exact time</button>
                <button class="ui-menu-item" type="button" role="menuitem" tabindex="-1" data-format="minutesOnly" data-menu-close>Minutes only</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="ui-surface note-card" aria-label="Your local note">
        <div class="editor-scroll">
          <div class="note-editor" id="note-editor" aria-hidden="true"></div>
          <div class="ui-separator ui-separator--vertical timestamp-divider" aria-hidden="true"></div>
          <textarea class="note-input" id="note-input" aria-label="Note text" placeholder="Start writing here…" spellcheck="true" autocapitalize="sentences" autocomplete="off" wrap="soft"></textarea>
        </div>

        <div class="note-footer">
          <span id="line-count">0 lines</span>
          <div><span class="local-indicator" aria-hidden="true"></span><span id="autosave-label">Saved on this device</span></div>
        </div>
      </section>

    </main>

    <input class="visually-hidden" id="file-input" type="file" accept=".md,.markdown,.txt,text/plain,text/markdown" />
  </body>
</html>
